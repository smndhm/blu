name: Accessibility

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/simon.duhem.fr/**'
      - 'apps/ia-postrophe/**'
      - 'apps/slides/src/**'
      - 'packages/ds/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/a11y.yml'

permissions:
  contents: read

jobs:
  axe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup environment
        uses: smndhm/dev-config/ci/setup@4074f1550123768d54f0d9da6af48521026f0c47 # main

      - name: Install Chromium
        run: pnpm --filter simon.duhem.fr exec playwright install --with-deps chromium

      # Builds what it audits first (turbo.json)
      - name: Run axe on every page, and on the design system's board of states
        run: pnpm test:a11y

      # When the board of the design system's states does not match its screenshots: the screenshots taken and their differences
      - name: Upload the differences of the states
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ds-states
          path: packages/ds/test-results/
          if-no-files-found: ignore
