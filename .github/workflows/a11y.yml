name: Accessibility

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/simon.duhem.fr/**'
      - 'apps/ia-postrophe/**'
      - 'apps/slides/src/**'
      - '.github/workflows/a11y.yml'

permissions:
  contents: read

jobs:
  axe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Install Chromium
        run: pnpm --filter simon.duhem.fr exec playwright install --with-deps chromium

      - name: Build site
        run: pnpm --filter "simon.duhem.fr..." build

      - name: Run axe on every page
        run: pnpm --filter simon.duhem.fr test:a11y
