name: Accessibility

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/simon.duhem.fr/**'
      - 'apps/ia-postrophe/**'
      - 'apps/slides/src/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/a11y.yml'

permissions:
  contents: read

jobs:
  axe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup environment
        uses: smndhm/dev-config/ci/setup@19119a179a8e532ef1f8d5d386d146b6a54a7535 # main

      - name: Install Chromium
        run: pnpm --filter simon.duhem.fr exec playwright install --with-deps chromium

      - name: Build site
        run: pnpm --filter "simon.duhem.fr..." build

      - name: Run axe on every page
        run: pnpm --filter simon.duhem.fr test:a11y
