name: Lint

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup environment
        uses: smndhm/dev-config/ci/setup@a942efbf8add3e1ee8831b61d0053192f0fa0ccf # main

      - name: Lint
        run: pnpm lint
