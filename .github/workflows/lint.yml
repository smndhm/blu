name: Lint

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup environment
        uses: smndhm/dev-config/ci/setup@64ca5c3c80d95caf963a424277d88897e849a0ce # main

      - name: Lint
        run: pnpm lint
