name: Renovate branch

on:
  push:
    branches:
      - 'renovate/**'

jobs:
  # Copies @dume/dev-config's files, adds the changesets, then runs the CI checks on that commit (see smndhm/dev-config)
  renovate-branch:
    uses: smndhm/dev-config/.github/workflows/renovate-branch.yml@73fa94bee891551a9ae9f455bf7c6dbb3f71bd09 # main
    permissions:
      contents: write
      statuses: write
    with:
      changesets: true
      checks: |
        pnpm lint
        pnpm test
        pnpm --filter "simon.duhem.fr..." build
        pnpm --filter simon.duhem.fr exec playwright install --with-deps chromium
        pnpm --filter simon.duhem.fr test:a11y
