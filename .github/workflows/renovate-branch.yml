name: Renovate branch

on:
  push:
    branches:
      - 'renovate/**'

jobs:
  # Copies @dume/dev-config's files, adds the changesets, then runs the CI checks on that commit (see smndhm/dev-config)
  renovate-branch:
    uses: smndhm/dev-config/.github/workflows/renovate-branch.yml@5860d0d1da14f56421b76f7453c5aad1cc2ce411 # main
    permissions:
      contents: write
      statuses: write
    with:
      changesets: true
      checks: |
        pnpm lint
        pnpm test
        pnpm doc:check
        pnpm --filter simon.duhem.fr exec playwright install --with-deps chromium
        pnpm test:a11y
