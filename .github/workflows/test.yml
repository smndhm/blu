name: Test

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup environment
        uses: smndhm/dev-config/ci/setup@19119a179a8e532ef1f8d5d386d146b6a54a7535 # main

      # Runs the `test` script of every package, after the package build
      # when its turbo.json asks for it (see packages/webcomp-utils and apps/ia-postrophe)
      - name: Run tests
        run: pnpm test
