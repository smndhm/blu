name: Test

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup environment
        uses: smndhm/dev-config/ci/setup@bde4a82a697c5e90bda3ef8e1abfd1c791fe13d9 # main

      # Runs the `test` script of every package, after the package build
      # when its turbo.json asks for it (see packages/webcomp-utils and apps/ia-postrophe)
      - name: Run tests
        run: pnpm test

      # The README of @dume/webcomp-utils is its API's documentation, generated by typedoc: it must be the one committed
      - name: Check the generated documentation
        run: pnpm doc:check
