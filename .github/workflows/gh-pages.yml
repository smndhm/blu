name: Deploy all apps to GitHub Pages

on:
  # Releases created by the Changeset workflow use GITHUB_TOKEN and do not trigger
  # other workflows, so the site is deployed on every push to main touching it.
  push:
    branches:
      - main
    paths:
      - 'apps/**'
      - '.github/workflows/gh-pages.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: lts/*
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Install dependencies
        run: pnpm i

      - name: Build simon.duhem.fr
        run: pnpm --filter simon.duhem.fr build

      - name: Build ia-postrophe
        run: pnpm --filter ia-postrophe build

      - name: Build slides (HTML)
        uses: docker://marpteam/marp-cli:v4.2.3@sha256:472c9e9203391568cd777a70455ee241ee8d16a123dbbc2329277a35b6c56fc8
        with:
          args: -I apps/slides/src -o apps/slides/dist
        env:
          MARP_USER: root:root

      - name: Build slides (PDF)
        uses: docker://marpteam/marp-cli:v4.2.3@sha256:472c9e9203391568cd777a70455ee241ee8d16a123dbbc2329277a35b6c56fc8
        with:
          args: -I apps/slides/src -o apps/slides/dist --pdf --allow-local-files
        env:
          MARP_USER: root:root

      - name: Prepare public folder
        run: |
          mkdir -p public/ia-postrophe
          mkdir -p public/slides/assets
          cp -r apps/simon.duhem.fr/_site/* public/
          cp -r apps/ia-postrophe/dist/ia-postrophe/* public/ia-postrophe/
          cp -r apps/slides/src/assets/* public/slides/assets/
          cp -r apps/slides/dist/* public/slides/

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
