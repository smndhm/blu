name: Deploy all apps to GitHub Pages

on:
  # Releases created by the Changeset workflow use GITHUB_TOKEN and do not trigger
  # other workflows, so the site is deployed on every push to main touching it.
  push:
    branches:
      - main
    paths:
      - 'apps/**'
      - '.github/workflows/gh-pages.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: lts/*
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Install dependencies
        run: pnpm i

      # Also builds its workspace dependencies first (ia-postrophe script)
      - name: Build simon.duhem.fr
        run: pnpm --filter "simon.duhem.fr..." build

      - name: Build slides (HTML)
        uses: docker://marpteam/marp-cli:v4.5.1@sha256:3cf660df7b9737f875e57f7169dff0b08d1d3ab604ea2d655ab761102942fa42
        with:
          args: -I apps/slides/src -o apps/slides/dist
        env:
          MARP_USER: root:root

      - name: Build slides (PDF)
        uses: docker://marpteam/marp-cli:v4.5.1@sha256:3cf660df7b9737f875e57f7169dff0b08d1d3ab604ea2d655ab761102942fa42
        with:
          args: -I apps/slides/src -o apps/slides/dist --pdf --allow-local-files
        env:
          MARP_USER: root:root

      - name: Prepare public folder
        run: |
          mkdir -p public/slides/assets
          cp -r apps/simon.duhem.fr/_site/* public/
          cp -r apps/slides/src/assets/* public/slides/assets/
          cp -r apps/slides/dist/* public/slides/

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
