name: Deploy all apps to GitHub Pages

on:
  # Releases created by the Changeset workflow use GITHUB_TOKEN and do not trigger
  # other workflows, so the site is deployed on every push to main touching it.
  push:
    branches:
      - main
    paths:
      - 'apps/**'
      - '.github/workflows/gh-pages.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Same Node version (.nvmrc) and install as the other workflows
      - name: Setup environment
        uses: ./.github/actions/setup

      # Also builds its workspace dependencies first (ia-postrophe script)
      - name: Build simon.duhem.fr
        run: pnpm --filter "simon.duhem.fr..." build

      - name: Build slides (HTML)
        uses: docker://marpteam/marp-cli:v4.5.1@sha256:3cf660df7b9737f875e57f7169dff0b08d1d3ab604ea2d655ab761102942fa42
        with:
          args: -I apps/slides/src -o apps/slides/dist
        env:
          MARP_USER: root:root

      - name: Build slides (PDF)
        uses: docker://marpteam/marp-cli:v4.5.1@sha256:3cf660df7b9737f875e57f7169dff0b08d1d3ab604ea2d655ab761102942fa42
        with:
          args: -I apps/slides/src -o apps/slides/dist --pdf --allow-local-files
        env:
          MARP_USER: root:root

      - name: Prepare public folder
        run: |
          mkdir -p public/slides/assets
          cp -r apps/simon.duhem.fr/_site/* public/
          cp -r apps/slides/src/assets/* public/slides/assets/
          cp -r apps/slides/dist/* public/slides/

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

      # IndexNow: notifies Bing, Yandex, Seznam, Naver and Yep of the sitemap URLs (Google does not use it).
      # The key is not secret: the search engines check it against apps/simon.duhem.fr/public/<key>.txt.
      # A failure here does not fail the deployment, which is already live.
      - name: Notify search engines (IndexNow)
        continue-on-error: true
        env:
          INDEXNOW_HOST: simon.duhem.fr
          INDEXNOW_KEY: 7b7af4d4409057f56000e0c4326fdcbc
        run: |
          grep -o '<loc>[^<]*</loc>' public/sitemap.xml | sed -e 's/<loc>//' -e 's/<\/loc>//' \
            | jq -R . | jq -s --arg host "$INDEXNOW_HOST" --arg key "$INDEXNOW_KEY" \
              '{host: $host, key: $key, keyLocation: "https://\($host)/\($key).txt", urlList: .}' \
            | tee /dev/stderr \
            | curl --fail-with-body --silent --show-error -X POST https://api.indexnow.org/indexnow \
                -H 'Content-Type: application/json; charset=utf-8' --data-binary @-
