name: Renovate → Changesets

on:
  push:
    branches:
      - 'renovate/**'

jobs:
  # Adds the changesets of the updated dependencies, then runs the CI checks on that commit (see smndhm/dev-config)
  changesets:
    name: Add changeset
    uses: smndhm/dev-config/.github/workflows/changesets-renovate.yml@53b9676b0670cba6a8c4a396fb20e8db4d933956 # main
    permissions:
      contents: write
      statuses: write
    with:
      checks: |
        pnpm lint
        pnpm test
        pnpm --filter "simon.duhem.fr..." build
        pnpm --filter simon.duhem.fr exec playwright install --with-deps chromium
        pnpm --filter simon.duhem.fr test:a11y
