name: Changeset

on:
  push:
    branches:
      - main

permissions:
  contents: write # Push the changeset-release/main branch and create releases
  pull-requests: write # Open the "Version Packages" pull request
  id-token: write # Required for OIDC

jobs:
  changeset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup environment
        uses: smndhm/dev-config/ci/setup@4f61116ca71fba9ca8a8b9e1d4e3953d92edbf57 # main

      - name: Publish packages
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: pnpm changeset:publish
          github-token: ${{ secrets.GITHUB_TOKEN }}
